spring.application.name=forohub

# Base de datos en memoria para los tests (no requiere MySQL)
spring.datasource.url=jdbc:h2:mem:forotest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

api.security.secret=secreto-de-test

api.cors.allowed-origins=http://localhost:3000
